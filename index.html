function fx(){for(let i=0;i<16;i++){const s=document.createElement('span');s.className='fx';s.textContent='🎉⭐🌟✨'[i%4];s.style.left=Math.random()*95+'%';document.body.appendChild(s);setTimeout(()=>s.remove(),2100)}}
const TF=[["صح","True"],["خطأ","False"]],H3=[["HTML","HTML"],["CSS","CSS"],["JavaScript","JavaScript"]];
const p=r=>r.split('|');
const t3=r=>{let[a,e,c]=p(r);return{a,e,o:H3,c:+c}},tf=r=>{let[a,e,c]=p(r);return{a,e,o:TF,c:c=='1'?0:1}},
mc=r=>{let[a,e,o,c]=p(r);return{a,e,o:o.split(';').map(x=>{let y=x.split('/');return[y[0],y[1]||y[0]]}),c:+c}};
const SEC=[
{n:'1',ic:'🏠',ta:'أدوار HTML وCSS وJavaScript',te:'Roles of HTML, CSS & JavaScript',
 ea:'تخيّل صفحة الويب كأنها بيت 🏠: <b>HTML</b> = الهيكل 🧱 (العناوين والفقرات والصور والروابط) • <b>CSS</b> = الدهانات والديكور 🎨 (الألوان والتخطيط والحجم والخطوط) • <b>JavaScript</b> = الكهرباء والسباكة ⚡ (يضيف السلوك: أزرار تستجيب، تحديث جزء من الشاشة). كل تقنية لها دور مستقل، ويمكن استخدام HTML وحده أو مع CSS وJavaScript حسب الحاجة.',
 ee:'Imagine a web page as a house 🏠: <b>HTML</b> = the frame 🧱 (headings, paragraphs, images, links) • <b>CSS</b> = interior & exterior 🎨 (colors, layout, size, fonts) • <b>JavaScript</b> = electrical & plumbing ⚡ (adds behavior: buttons respond, part of the screen updates). Each has an independent role; a page can use HTML alone or with CSS and JavaScript as needed.',
 q:['تغيير لون النص وحجمه|Changing the color and size of text|1','تحديث جزء من الشاشة عند الضغط على زر|Updating part of the screen when a button is pressed|2','وضع الصور والروابط|Placing images and links|0','تحديد لون خلفية الصفحة بأكملها|Setting the background color of the entire page|1','التحقق من صحة المحتويات المدخلة في نموذج|Validating the contents entered into a form|2'].map(t3)},
{n:'2',ic:'🏷️',ta:'HTML الدلالية',te:'Semantic HTML',
 ea:'<b>HTML الدلالي</b> = عناصر اسمها يوضح وظيفتها: <code>&lt;header&gt;</code> أعلى الصفحة • <code>&lt;nav&gt;</code> للتنقل • <code>&lt;main&gt;</code> للمحتوى الرئيسي • <code>&lt;footer&gt;</code> أسفل الصفحة. الفوائد: ① <b>إمكانية الوصول</b>: قارئ الشاشة يفهم البنية ويخدم ذوي الإعاقة البصرية ② <b>SEO</b>: محركات البحث تفهم المحتوى أفضل، لكنه لا يضمن ترتيبًا أعلى.',
 ee:'<b>Semantic HTML</b> = tags whose names show their meaning: <code>&lt;header&gt;</code> top • <code>&lt;nav&gt;</code> navigation • <code>&lt;main&gt;</code> main content • <code>&lt;footer&gt;</code> bottom. Benefits: ① <b>Accessibility</b>: screen readers understand the structure; helps visually impaired users ② <b>SEO</b>: search engines understand content better, but it does not guarantee a higher ranking.',
 q:['يمكن أن يساعد استخدام HTML الدلالية قارئ الشاشة على فهم بنية الصفحة|Semantic HTML can help screen readers understand the page structure|1','HTML الدلالية تضمن حصول الصفحة على ترتيب أعلى في محركات البحث|Semantic HTML guarantees a higher ranking in search results|0','تصبح سرعة عرض صفحة الويب أسرع بالضرورة|The page display speed necessarily becomes faster|0','HTML الدلالية تستخدم عناصر توضح وظيفة أجزاء الصفحة|Semantic HTML uses elements that show the function of page parts|1','العنصر nav يُستخدم عادةً للمحتوى الرئيسي للصفحة|The nav element is usually used for the main content|0'].map(tf)},
{n:'3',ic:'📱',ta:'التصميم المتجاوب',te:'Responsive Design',
 ea:'<b>التصميم المتجاوب</b> 📱💻: التخطيط يُضبط تلقائيًا حسب حجم الشاشة (كمبيوتر، هاتف، جهاز لوحي)، فصفحة واحدة تظهر جيدًا على أي جهاز. ولأن كثيرًا من الناس يتصفحون بالهاتف، يُراعي المطورون الشاشات الصغيرة من البداية، وهذا يُسمى <b>نهج الأولوية للجوال (Mobile-first)</b>.',
 ee:'<b>Responsive design</b> 📱💻: the layout adjusts automatically to the screen size (PC, phone, tablet), so one page looks good on any device. Because many people browse on phones, developers consider small screens from the start; this is called the <b>mobile-first</b> approach.',
 q:['التصميم المتجاوب يجعل تخطيط الصفحة يتكيف مع أحجام الشاشات المختلفة|Responsive design makes the layout adapt to different screen sizes|1','التصميم المتجاوب مخصص لأجهزة الكمبيوتر فقط|Responsive design is for computers only|0','نهج الأولوية للجوال يعني مراعاة الشاشات الصغيرة منذ بداية التصميم|Mobile-first means considering small screens from the start of design|1','التصميم المتجاوب يُستخدم لإضافة سلوك إلى صفحات الويب|Responsive design is used to add behavior to web pages|0','الحاجة للتصميم المتجاوب لأن المواقع تُفتح من أجهزة متنوعة|Responsive design is needed because sites are accessed from various devices|1'].map(tf)},
{n:'4',ic:'🧰',ta:'أطر العمل',te:'Frameworks',
 ea:'<b>إطار العمل</b> = بنية توفر مسبقًا وظائف ومكونات شائعة الاستخدام لجعل تطوير تطبيقات الويب أكثر كفاءة، فلا تكتب كل الكود من الصفر. أمثلة: <b>React</b> مكتبة JavaScript لبناء واجهات المستخدم من مكونات قابلة لإعادة الاستخدام • <b>Vue</b> بنية بسيطة وتبني التطبيق تدريجيًا • <b>Next.js</b> إطار مبني على React.',
 ee:'<b>Framework</b> = a structure that provides commonly used functions and components in advance to make web development more efficient, so you do not write all code from scratch. Examples: <b>React</b> is a JavaScript library for building UIs from reusable components • <b>Vue</b> has a simple structure and lets you build step by step • <b>Next.js</b> is built on React.',
 q:['إطار العمل يوفر وظائف ومكونات شائعة الاستخدام مسبقًا|A framework provides commonly used functions and components in advance|1','استخدام إطار العمل يتطلب من المطور كتابة جميع الأكواد من الصفر|Using a framework requires writing all code from scratch|0','React مكتبة JavaScript تُستخدم لبناء واجهات المستخدم|React is a JavaScript library used to build user interfaces|1','Next.js إطار مبني على React|Next.js is a framework built on React|1','Vue لا يمكن استخدامه في تطوير تطبيقات الويب|Vue cannot be used to develop web applications|0'].map(tf)}];
const EX=['ما التقنية التي تحدد بنية صفحة الويب؟|Which technology defines the structure of a web page?|CSS;JavaScript;HTML;SEO|2','ما التقنية المسؤولة عن مظهر الصفحة؟|Which technology is responsible for the appearance?|HTML;CSS;SEO;React|1','ما التقنية التي تضيف التفاعل والسلوك؟|Which technology adds interactivity and behavior?|HTML;CSS;SEO;JavaScript|3','أي عنصر يُستخدم عادةً لتحديد رأس الصفحة؟|Which element is usually used for the page header?|<main>;<nav>;<header>;<footer>|2','ما المقصود بـ HTML الدلالية؟|What is meant by semantic HTML?|تحديد وظيفة العناصر/Defining the function of elements;تغيير الألوان/Changing colors;تشغيل الخادم/Running the server;ضغط الصور/Compressing images|0','ما إحدى فوائد HTML الدلالية؟|What is one benefit of semantic HTML?|زيادة سرعة الإنترنت/Increasing internet speed;مساعدة قارئ الشاشة/Helping screen readers;تغيير حجم الشاشة/Changing screen size;تشغيل الفيديو/Playing video|1','ما الهدف الأساسي من التصميم المتجاوب؟|What is the main goal of responsive design?|حماية البيانات/Protecting data;تحسين محركات البحث/Improving SEO;التكيف مع الشاشات/Adapting to screens;إنشاء قواعد البيانات/Creating databases|2','ماذا يعني نهج الأولوية للجوال؟|What does mobile-first mean?|التصميم للشاشات الصغيرة أولًا/Designing for small screens first;إلغاء نسخة الكمبيوتر/Cancelling the desktop version;استخدام الهاتف فقط/Using phones only;منع الأجهزة اللوحية/Blocking tablets|0','ما المقصود بإطار العمل؟|What is a framework?|برنامج للحماية/A security program;وظائف ومكونات جاهزة/Ready-made functions and components;محرك بحث/A search engine;نوع من قواعد البيانات/A type of database|1','أي مما يلي مكتبة JavaScript لبناء واجهات المستخدم؟|Which is a JavaScript library for building UIs?|React;HTML;CSS;SEO|0','أي إطار عمل مبني على React؟|Which framework is built on React?|Vue;CSS;Next.js;HTML|2','ما المقصود بإمكانية الوصول Accessibility؟|What is Accessibility?|تسريع الإنترنت/Speeding up the internet;جعل الواجهة قابلة للاستخدام للجميع/Making the interface usable by everyone;تحسين ألوان الموقع/Improving site colors;إنشاء الخادم/Creating the server|1','ما المقصود بـ SEO؟|What does SEO mean?|تصميم الواجهات/Interface design;برمجة الخادم/Server programming;تحسين محركات البحث/Search engine optimization;حماية الشبكات/Network protection|2','أي تقنية يمكنها إنشاء عداد يتغير عند تفاعل المستخدم؟|Which technology can create a counter that changes when the user interacts?|HTML;CSS;JavaScript;SEO|2','ما الفائدة من استخدام المكتبات وأطر العمل؟|What is the benefit of libraries and frameworks?|زيادة العمل المتكرر/Increasing repeated work;تقليل بعض العمل المتكرر/Reducing some repeated work;إلغاء HTML/Cancelling HTML;إلغاء CSS/Cancelling CSS|1'].map(mc).concat(
['HTML هي اللغة التي تحدد بنية صفحة الويب|HTML defines the structure of a web page|1','CSS مسؤولة عن إضافة السلوك التفاعلي إلى صفحة الويب|CSS is responsible for adding interactive behavior|0','JavaScript تضيف التفاعل والسلوك إلى صفحة الويب|JavaScript adds interactivity and behavior|1','يمكن أن تستخدم صفحة الويب HTML وحدها دون CSS وJavaScript|A web page can use HTML alone without CSS and JavaScript|1','إطار العمل يوفر وظائف ومكونات شائعة الاستخدام مسبقًا|A framework provides common functions and components in advance|1','إمكانية الوصول تهدف إلى جعل المحتوى والواجهة قابلين للاستخدام من أشخاص ذوي قدرات مختلفة|Accessibility aims to make content usable by people with different abilities|1','SEO تعني تحسين محركات البحث|SEO means search engine optimization|1','CSS هي المسؤولة عن بناء هيكل صفحة الويب|CSS is responsible for building the page structure|0','تساعد المكتبات وأطر العمل على بناء الواجهات من مكونات قابلة لإعادة الاستخدام|Libraries and frameworks help build interfaces from reusable components|1','التصميم المتجاوب مخصص لأجهزة الكمبيوتر فقط|Responsive design is for computers only|0'].map(tf));
const ES=[["كيف تعمل HTML وCSS وJavaScript معًا لبناء صفحة ويب، وما الذي يجعل الواجهة الأمامية الحديثة ذات معنى وقابلة للتكيف وفعّالة في البناء؟ (السؤال الرئيسي)", "How do HTML, CSS and JavaScript work together to build a web page, and what makes a modern frontend meaningful, adaptable and efficient to build? (Lesson question)", "تُبنى صفحة الويب من ثلاث تقنيات لكل منها دور مستقل: HTML يحدد البنية، وCSS يحدد المظهر، وJavaScript يضيف السلوك والتفاعل، وبدمجها تتكوّن الصفحة. والواجهة الأمامية الحديثة تضيف: HTML الدلالي (عناصر ذات معنى تفهمها قارئات الشاشة ومحركات البحث، فتتحسن إمكانية الوصول وSEO)، والتصميم المتجاوب (تخطيط يتكيف مع أي حجم شاشة مع نهج الأولوية للجوال)، وأطر العمل مثل React وVue وNext.js (وظائف ومكونات جاهزة فلا نكتب كل شيء من الصفر). فالصفحة الحديثة: منظمة، منسقة، تفاعلية، ذات معنى، قابلة للتكيف، وفعّالة في البناء.", "A web page is built from three technologies with independent roles: HTML defines the structure, CSS specifies the appearance, and JavaScript adds behavior and interactivity; combined, they create the page. A modern frontend adds: semantic HTML (meaningful tags that screen readers and search engines understand, improving accessibility and SEO), responsive design (a layout that adapts to any screen size, with a mobile-first approach), and frameworks such as React, Vue and Next.js (ready-made functions and components so we do not write everything from scratch). A modern page is therefore structured, styled, interactive, meaningful, adaptable and efficient to build."], ["اشرح كيف تساهم كل من HTML وCSS وJavaScript في صفحة مكتبة تعرض قائمة كتب، وتكون منسقة، وتُصفّي النتائج أثناء كتابة المستخدم. [6 درجات] (في إجابتك راجع: البنية، المظهر، السلوك)", "Explain how HTML, CSS and JavaScript each contribute to a library page that lists books, is styled, and filters the results as the user types. [6] (Refer to: structure, appearance, behavior)", "البنية: HTML يبني الصفحة (العنوان، قائمة الكتب، مربع البحث). المظهر: CSS ينسّق الألوان والخطوط والتخطيط والحجم. السلوك: JavaScript يستجيب لكتابة المستخدم فيصفّي قائمة الكتب ويحدّث جزءًا فقط من الشاشة. وبدمج التقنيات الثلاث تكتمل الصفحة.", "Structure: HTML builds the page (title, book list, search box). Appearance: CSS styles the colors, fonts, layout and size. Behavior: JavaScript responds as the user types, filters the book list and updates only part of the screen. Combined, the three technologies complete the page."], ["لماذا يفهم قارئ الشاشة الصفحة بشكل أفضل عندما تستخدم header وnav وmain بدلًا من صناديق عادية؟", "Why does a screen reader understand a page better when it uses <header>, <nav> and <main> instead of plain boxes?", "لأن هذه العناصر الدلالية توضح وظيفة كل جزء من الصفحة ومعناه (header = رأس الصفحة، nav = منطقة التنقل والروابط، main = المحتوى الرئيسي) وليس مجرد شكله. أما الصناديق العادية (div) فلا توضح وظيفة كل جزء بنفس الدرجة، فيستطيع قارئ الشاشة التعرف على بنية الصفحة والتنقل فيها بسهولة.", "Because these semantic elements show the function and meaning of each part (header = top of the page, nav = navigation and links, main = main content), not just its look. Plain div boxes do not show each part's function to the same degree, so the screen reader can recognize the page structure and move around it easily."], ["في صفحة تستخدمها كثيرًا، ما الأجزاء التي تمثل البنية (HTML)، وما التي تمثل الشكل (CSS)، وما الذي يتفاعل معك (JavaScript)؟", "On a page you use often, which parts are structure (HTML), which are style (CSS), and which react to you (JavaScript)?", "إجابة نموذجية (موقع المدرسة): البنية HTML = العناوين والفقرات والصور والروابط. الشكل CSS = الألوان والخطوط وتخطيط الصفحة. التفاعل JavaScript = الأزرار والقوائم ومربعات البحث التي تستجيب، والعدّادات والشاشات التي تُحدّث بياناتها.", "Model answer (a school website): Structure HTML = headings, paragraphs, images and links. Style CSS = colors, fonts and page layout. Reaction JavaScript = buttons, menus and search boxes that respond, counters and screens that update their data."], ["أي من الفوائد تتعلق بمظهر الصفحة، وأيها تتعلق بمدى سهولة إيجادها وقراءتها من قبل الآخرين؟", "Which of the benefits relate to how the page looks, and which relate to how well others can find and read it?", "فوائد HTML الدلالية لا تتعلق بالمظهر؛ فالمظهر مسؤولية CSS. إمكانية الوصول (قارئ الشاشة يفهم الصفحة) تتعلق بسهولة قراءتها واستخدامها من قبل الآخرين، وفهم محركات البحث (SEO) يتعلق بسهولة إيجادها (دون ضمان ترتيب أعلى). أما التصميم المتجاوب فيتعلق بشكل عرض الصفحة وتكيّفها مع حجم الشاشة.", "The benefits of semantic HTML are not about appearance; appearance is CSS's job. Accessibility (screen readers understand the page) is about how easily others can read and use it, and search-engine understanding (SEO) is about how easily it can be found (without guaranteeing a higher rank). Responsive design is about how the page is displayed and adapts to the screen size."], ["فكّر كمهندس – لاحظ أولًا: افتح صفحة تستخدمها كثيرًا ولاحظ أمرين يتغيران عند النقر أو الكتابة. ثم لثلاث ميزات في صفحة النادي (قائمة الفعاليات، ألوان النادي وتخطيطه، عدّاد التسجيل الحي) حدّد أي تقنية (HTML أو CSS أو JavaScript) تقوم بكل منها ولماذا.", "Think as an Engineer – Observe first: open one web page you use often and note two things on it that change when you click or type. Then, for three features of the club page (the list of events, the club's colors and layout, the live sign-up counter), say which technology (HTML, CSS or JavaScript) does each, and why.", "أمثلة للتغيرات: مربع البحث يقترح نتائج أثناء الكتابة، وزر الإعجاب يزيد العدّاد عند النقر. قائمة الفعاليات = HTML لأنه يحدد البنية والمحتوى. ألوان النادي وتخطيطه = CSS لأنه يحدد المظهر. عدّاد التسجيل الحي = JavaScript لأنه يضيف السلوك ويحدّث الشاشة عند الضغط على الزر.", "Examples of changes: a search box suggests results as you type, and a like button raises the counter when clicked. The list of events = HTML because it defines the structure and content. The club's colors and layout = CSS because it specifies the appearance. The live sign-up counter = JavaScript because it adds behavior and updates the screen when the button is pressed."], ["فكّر كمهندس – اجعلها تصل إلى الجميع: اذكر تغييرًا واحدًا يجعل الصفحة أسهل قراءة على الهاتف (التصميم المتجاوب)، واختيارًا واحدًا في HTML الدلالي يساعد قارئ الشاشة.", "Think as an Engineer – Make it reach everyone: name one change that would make the page easier to read on a phone (responsive design), and one semantic-HTML choice that would help a screen reader.", "التصميم المتجاوب: ضبط التخطيط تلقائيًا ليتناسب مع الشاشة الصغيرة (مع نهج الأولوية للجوال). HTML الدلالي: استخدام عناصر header وnav وmain وfooter بدلًا من صناديق عادية ليتعرف قارئ الشاشة على بنية الصفحة.", "Responsive design: make the layout adjust automatically to the small screen (with a mobile-first approach). Semantic HTML: use header, nav, main and footer elements instead of plain boxes so the screen reader can recognize the page structure."], ["فكّر كمهندس – قرّر: أوصِ بما إذا كان على النادي أن يفصل HTML وCSS وJavaScript، وقدّم سببين. في أزواج: قارنوا توزيعكم للأدوار واتفقوا معًا على ما يحتاجه عدّاد التسجيل. (قدّم دليلًا على إجابتك)", "Think as an Engineer – Decide: recommend whether the club should separate HTML, CSS and JavaScript, and give two reasons. In pairs, compare your role assignments and agree on what the sign-up counter needs. (Give evidence for your answer)", "إجابة نموذجية: نعم، يُستخدم كل منها في دوره الصحيح. السبب 1: لكل تقنية دور مستقل (HTML يحمل المحتوى، CSS ينسّقه، JavaScript يجعله يتفاعل ويتحدّث) فالصفحة تُبنى بدمجها. السبب 2: فصل الأدوار يجعل الكود أوضح وأسهل في التعديل (تغيير الألوان لا يمس المحتوى أو السلوك). العدّاد يحتاج: HTML لزر وعنصر يعرض الرقم، وCSS لتنسيقهما بألوان النادي، وJavaScript لزيادة الرقم وتحديثه عند الضغط.", "Model answer: Yes, use each for its proper role. Reason 1: each technology has an independent role (HTML holds the content, CSS styles it, JavaScript makes it react and update), and the page is built by combining them. Reason 2: separating the roles keeps the code clearer and easier to change (changing colors does not touch the content or behavior). The counter needs: HTML for a button and an element showing the number, CSS to style them in the club's colors, and JavaScript to raise and update the number when the button is pressed."], ["في سياق جديد: يريد موقع إخباري أن يعمل جيدًا على الهاتف وأن يفهم محرك البحث بنية صفحاته. اذكر اختيارًا في التصميم المتجاوب واختيارًا في HTML الدلالي، واشرح الفائدة المتوقعة من كل منهما.", "In a New Context: a news site must look good on phones and be found easily by search engines. Name one responsive-design choice and one semantic-HTML choice it should make, and say what each one improves.", "التصميم المتجاوب (نهج الأولوية للجوال): يجعل التخطيط يتكيف مع الشاشة الصغيرة فيسهل الاستخدام على الهاتف. HTML الدلالي (header وnav وmain): يساعد محركات البحث على فهم بنية المحتوى بصورة أفضل (دون ضمان ترتيب أعلى)، ويساعد قارئات الشاشة أيضًا.", "Responsive design (mobile-first): makes the layout adapt to the small screen, improving use on phones. Semantic HTML (header, nav, main): helps search engines understand the content structure better (without guaranteeing a higher rank), and helps screen readers too."], ["تأمّل: من بين البنية والشكل والسلوك، أيها تلاحظه أكثر عندما تكون صفحة الويب سيئة الصنع، ولماذا؟", "Reflect: of structure, style and behavior, which do you notice most when a web page is badly made, and why?", "إجابة نموذجية (رأي الطالب مع التعليل): قد نلاحظ الشكل (CSS) أكثر لأنه ما نراه مباشرة، كألوان غير مريحة أو تخطيط مبعثر. وقد نلاحظ السلوك (JavaScript) عندما لا يستجيب زر. وسوء البنية (HTML) يظهر في ترتيب العناوين والفقرات. المهم أن تعلّل اختيارك.", "Model answer (student's opinion with a reason): We may notice style (CSS) most because we see it directly, such as uncomfortable colors or a messy layout. We may notice behavior (JavaScript) when a button does not respond. Poor structure (HTML) shows in the order of headings and paragraphs. What matters is that you give a reason for your choice."], ["التحدي: اذكر موقعًا واحدًا تستخدمه، وصف شيئًا واحدًا يقوم به كل من HTML وCSS وJavaScript فيه.", "Challenge: name one website you use and describe one thing HTML, CSS and JavaScript each do on it.", "إجابة نموذجية (موقع المدرسة): HTML = يضع عنوان الصفحة والروابط والصور. CSS = يحدد ألوان الموقع وخطوطه وتخطيطه. JavaScript = يجعل مربع البحث والأزرار تستجيب وتحدّث جزءًا من الشاشة.", "Model answer (a school website): HTML = places the page title, links and images. CSS = sets the site's colors, fonts and layout. JavaScript = makes the search box and buttons respond and update part of the screen."], ["اذكر المصطلح أو المفهوم العلمي لكل ما يلي: (1) يحدد بنية صفحة الويب ويصف عناصرها (العناوين والصور والفقرات والروابط). (2) يحدد مظهر الصفحة (الألوان والتخطيط والحجم والخطوط). (3) يضيف السلوك والتفاعلية عند الضغط على الأزرار. (4) يجعل التخطيط يتكيف تلقائيًا مع أحجام الشاشات المختلفة. (5) ممارسات تجعل الصفحة أيسر في الفهرسة والظهور في نتائج البحث.", "Give the scientific term or concept for each: (1) Defines the structure of a web page and describes its elements (headings, images, paragraphs, links). (2) Specifies the appearance (colors, layout, size, fonts). (3) Adds behavior and interactivity when buttons are pressed. (4) Makes the layout adapt automatically to different screen sizes. (5) Practices that make a page easier to index and appear in search results.", "(1) HTML (2) CSS (3) JavaScript (4) التصميم المتجاوب Responsive design (5) تحسين محركات البحث SEO", "(1) HTML (2) CSS (3) JavaScript (4) Responsive design (5) SEO (Search Engine Optimization)"]];
function quiz(id,items){S[id]=S[id]||{d:0,s:0};return items.map((it,i)=>`<div class="q">${T((i+1)+') '+it.a,(i+1)+') '+it.e)}${it.o.map((o,j)=>`<button class="o" onclick="ans(this,'${id}',${i},${j})">${T(o[0],o[1])}</button>`).join('')}</div>`).join('')+`<div class="sc" id="sc${id}"></div>`}
const ALL={};
function ans(b,id,i,j){const it=ALL[id][i],q=b.parentNode;if(q.dataset.d)return;q.dataset.d=1;const ok=j==it.c;b.classList.add(ok?'ok':'no');q.querySelectorAll('.o')[it.c].classList.add('ok');snd(ok);if(ok){fx();S[id].s++}S[id].d++;$('#sc'+id).innerHTML=T(`النتيجة: ${S[id].s} / ${S[id].d} من ${it.n||ALL[id].length}`,`Score: ${S[id].s} / ${S[id].d} of ${ALL[id].length}`).replace(/ من \d+/,'');if(id=='x'&&S.x.d==ALL.x.length)fin()}
function fin(){const m=`الاسم: ${name}\nدرس: أساسيات الواجهة الأمامية (3-3)\nالنتيجة: ${S.x.s}/${ALL.x.length}`;$('#sc'+'x').innerHTML+=`<div class="card">${T('🏆 انتهى الاختبار! ','🏆 Exam finished!')}<a href="https://wa.me/201099920517?text=${encodeURIComponent(m)}" target="_blank"><button>${'📲 إرسال النتيجة / Send result (WhatsApp)'}</button></a></div>`}
function go(i){cur=i;render()}
function render(){let h=`<div class="nav">${SEC.map((s,i)=>`<button class="${cur==i?'on':''}" onclick="go(${i})">${s.ic} ${s.n}</button>`).join('')}<button class="${cur==4?'on':''}" onclick="go(4)">📝 ${'اختبار / Exam'}</button><button class="${cur==5?'on':''}" onclick="go(5)">✍️ ${'مقالي / Essay'}</button><button onclick="mode=(mode+1)%3;document.body.className=['m-both','m-ar','m-en'][mode]">🌐 AR/EN</button></div>`;
if(cur<4){const s=SEC[cur];ALL['s'+cur]=s.q;h+=`<div class="card"><h2>${T(s.ic+' '+s.ta,s.ic+' '+s.te)}</h2>${T(s.ea,s.ee)}</div><div class="card"><h3>${T('🎯 اختبر نفسك','🎯 Test yourself')}</h3>${quiz('s'+cur,s.q)}</div><button onclick="go(${cur+1})">${'التالي / Next ➡️'}</button>`}
else if(cur==4){ALL.x=EX;h+=`<div class="card"><h2>${T('📝 الاختبار النهائي (أسئلة الملفين)','📝 Final exam (questions from both files)')}</h2>${quiz('x',EX)}</div>`}
else h+=`<div class="card"><h2>${T('✍️ الأسئلة المقالية والإجابات النموذجية','✍️ Essay questions & model answers')}</h2>${ES.map((e,i)=>`<div class="q">${T((i+1)+') '+e[0],(i+1)+') '+e[1])}<button onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">✅ ${'الإجابة النموذجية / Model Answer'}</button><div class="card" hidden style="background:#ecfdf5">${T(e[2],e[3])}</div></div>`).join('')}</div>`;
